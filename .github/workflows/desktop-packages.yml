name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional matching tag to create a draft release for"
        required: false
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[bluetooth,packaging]"
      - run: python -m PyInstaller --noconfirm --clean packaging/windows/agent_deck.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        id: build
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" packaging/windows/agent_deck.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-Windows-Installer
          path: release/AgentDeck-Setup-*.exe
          if-no-files-found: error

  linux:
    # Build on Ubuntu 22.04 for a relatively old glibc baseline. Actual Linux
    # installation and device behavior have not yet been verified.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[bluetooth,packaging]"
      - run: python -m PyInstaller --noconfirm --clean packaging/linux/agent_deck.spec
      - name: Smoke test frozen CLI
        run: ./dist/AgentDeck/AgentDeck --help
      - name: Archive experimental Linux package
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          mkdir -p release
          cp packaging/linux/README.txt dist/AgentDeck/README-Linux.txt
          tar -czf "release/AgentDeck-Linux-x86_64-EXPERIMENTAL-$version.tar.gz" -C dist AgentDeck
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-Linux-x86_64-EXPERIMENTAL
          path: release/AgentDeck-Linux-x86_64-EXPERIMENTAL-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          project_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag $TAG_NAME does not match project version $project_version" >&2
            exit 1
          fi
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          Agent Deck $version release assets.

          **Linux package is experimental.** It has not yet been verified on a Linux installation or with a real Flipper device on Linux. See the README for setup notes and known platform limitations.
          EOF
          gh release create "$TAG_NAME" release/* --draft --title "Agent Deck $version" --notes-file "$notes_file"
