name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[bluetooth,packaging]"
      - run: python -m PyInstaller --noconfirm --clean packaging/windows/agent_deck.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME.TrimStart('v') -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" packaging/windows/agent_deck.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDeck-Windows-Installer
          path: release/AgentDeck-Setup-*.exe
          if-no-files-found: error
      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "release/AgentDeck-Setup-$env:APP_VERSION.exe"
          --draft --title "Agent Deck $env:APP_VERSION" --generate-notes
        shell: pwsh
