name: Check Agent Deck
on: [push, pull_request]
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s bridge/tests -v
  flipper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ufbt==0.2.6
      - run: ufbt update --hw-target=f7 --url=https://update.flipperzero.one/builds/firmware/1.5.1/flipper-z-f7-sdk-1.5.1.zip
      - run: ufbt
        working-directory: flipper
      - uses: actions/upload-artifact@v4
        with:
          name: agent-deck-firmware-1.5.1
          path: flipper/dist/agent_deck.fap
